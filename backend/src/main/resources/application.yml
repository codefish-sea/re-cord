server:
  port: 8090
spring:
  spring:
    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 20MB

  output:
    ansi:
      enabled: ALWAYS
  profiles:
    active: prod
    include: secret
  datasource:


#   url: jdbc:mysql://localhost:3307/recorddb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    url: jdbc:mysql://localhost:3333/recorddb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#   url: jdbc:mysql://localhost:3306/recorddb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

    username: commitmate
    password: commitmate
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            clientId: ON_SECRET
            scope: profile_nickname, account_email
            client-name: Kakao
            authorization-grant-type: authorization_code
#            redirect-uri: "https://api.blog.re-cord.site/login/oauth2/code/kakao"
            redirect-uri: "${custom.site.backUrl}/{action}/oauth2/code/{registrationId}"
          #            redirect-uri: "http://localhost:8090/login/oauth2/code/kakao"

          github:
            clientId: ON_SECRET
            client-secret: ON_SECRET
            scope:
              - read:user
              - user:email
            client-name: Github
            authorization-grant-type: authorization_code
#            redirect-uri: "https://api.blog.re-cord.site/login/oauth2/code/github"
            redirect-uri: "${custom.site.backUrl}/{action}/oauth2/code/{registrationId}"

          google:
            clientId: ON_SECRET
            scope:
              - profile
              - email
            client-name: Google
            authorization-grant-type: authorization_code
            redirect-uri: "${custom.site.backUrl}/{action}/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: id

logging:
  level:
    com.ll.blog: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
custom:
  dev:
    cookieDomain: localhost
    frontUrl: "http://${custom.dev.cookieDomain}:3000"
    backUrl: "http://${custom.dev.cookieDomain}:${server.port}"
  prod:
    cookieDomain: re-cord.site
    frontUrl: "https://www.${custom.prod.cookieDomain}"
    backUrl: "https://api.blog.${custom.prod.cookieDomain}"
  site:
    name: "BLOG DEV"
    cookieDomain: "${custom.prod.cookieDomain}"
    frontUrl: "${custom.prod.frontUrl}"
    backUrl: "${custom.prod.backUrl}"
